<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            z-index: 10;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: min(90vw, 420px);
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status">Koppints a képernyőre a hang engedélyezéséhez!</div>

    <a-scene id="ar-scene" 
             mindar-image="imageTargetSrc: img/target.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="assets-container"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="targets-container"></a-entity>
        
    </a-scene>

    <script>
        const targetNames = [
            "autismo", "bluetornado", "gardaland", "genova1", "giustigarden",
            "giustigarden2", "kilato", "lecco", "lenno", "lenno2",
            "lennohajo1", "lennohajo2", "lennohajo3", "lennohajo4", "MJ",
            "oblivion", "portofino", "portofinohazamenet", "portofinostrand",
            "portofinovonat", "raptor", "setavonat", "sirmione", "sirmionepart",
            "tuzijatek", "veronanaplemente"
        ];

        const assetsContainer = document.querySelector("#assets-container");
        const targetsContainer = document.querySelector("#targets-container");
        const status = document.querySelector("#status");
        const scene = document.querySelector("#ar-scene");

        let activeVideo = null;
        let soundAllowed = false;

        // Hang engedélyezése az első érintésre (mobil böngésző szabály)
        const enableAudio = () => {
            soundAllowed = true;
            status.textContent = "Kamera kész. Irányítsd egy képre!";
            if (activeVideo) {
                activeVideo.muted = false;
                activeVideo.play().catch(() => {});
            }
            window.removeEventListener("click", enableAudio);
            window.removeEventListener("touchstart", enableAudio);
        };
        window.addEventListener("click", enableAudio);
        window.addEventListener("touchstart", enableAudio);

        targetNames.forEach((name, index) => {
            const cleanName = name.trim();
            
            // 1. Videó elem létrehozása (preload="metadata" a memória kíméléséért)
            const videoEl = document.createElement("video");
            videoEl.setAttribute("id", `video-${cleanName}`);
            videoEl.setAttribute("src", `img/${cleanName}.mp4`);
            videoEl.setAttribute("preload", "metadata");
            videoEl.setAttribute("crossorigin", "anonymous");
            videoEl.setAttribute("webkit-playsinline", "");
            videoEl.setAttribute("playsinline", "");
            videoEl.muted = true; // Kezdetben némítva az autoplay hiba elkerülésére
            videoEl.loop = true;

            assetsContainer.appendChild(videoEl);

            // 2. AR Célpont létrehozása
            const targetEntity = document.createElement("a-entity");
            targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

            // 3. Videó sík létrehozása (alapértelmezett 1x1.78 mérettel)
            const videoPlane = document.createElement("a-video");
            videoPlane.setAttribute("src", `#video-${cleanName}`);
            videoPlane.setAttribute("position", "0 0 0");
            videoPlane.setAttribute("width", "1");
            videoPlane.setAttribute("height", "1.78");
            videoPlane.setAttribute("rotation", "0 0 0");

            // Automatikus méretre igazítás, amint a videó metaadatai betöltődnek
            videoEl.addEventListener("loadedmetadata", () => {
                if (videoEl.videoWidth && videoEl.videoHeight) {
                    const calculatedRatio = videoEl.videoHeight / videoEl.videoWidth;
                    videoPlane.setAttribute("height", calculatedRatio);
                }
            });

            targetEntity.appendChild(videoPlane);
            targetsContainer.appendChild(targetEntity);

            // 4. Eseménykezelők a lejátszáshoz
            targetEntity.addEventListener("targetFound", () => {
                console.log(`Célpont megtalálva: ${cleanName}`);
                status.textContent = `${cleanName} felismerve!`;

                if (activeVideo && activeVideo !== videoEl) {
                    activeVideo.pause();
                    activeVideo.currentTime = 0;
                }

                activeVideo = videoEl;

                if (soundAllowed) {
                    videoEl.muted = false;
                }

                videoEl.play().catch(() => {
                    status.textContent = "Érintsd meg a képernyőt a lejátszáshoz.";
                });
            });

            targetEntity.addEventListener("targetLost", () => {
                console.log(`Célpont elveszítve: ${cleanName}`);
                videoEl.pause();
                status.textContent = "Keresem a képet...";
            });
        });

        scene.addEventListener("arReady", () => {
            if (!soundAllowed) {
                status.textContent = "Koppints a képernyőre a hang engedélyezéséhez!";
            }
        });

        scene.addEventListener("arError", () => {
            status.textContent = "Nem sikerült elindítani a kamerát. Ellenőrizd a jogosultságokat.";
        });
    </script>

</body>
</html>
