<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR</title>
    <!-- A-Frame és MindAR könyvtárak -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            z-index: 10;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: min(90vw, 420px);
            padding: 12px 16px;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status">Kamera indítása...</div>

    <a-scene id="ar-scene" 
             mindar-image="imageTargetSrc: img/target.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="assets-container"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="targets-container"></a-entity>
        
    </a-scene>

    <script>
        // A tömb pontosan követi a fájlrendszerek és a MindAR compiler kis/nagybetűt nem megkülönböztető ábécésorrendjét.
        const targetNames = [
            "autismo",
            "bluetornado",
            "gardaland",
            "genova1",
            "giustigarden",
            "giustigarden2",
            "kilato",
            "lecco",
            "lenno",
            "lenno2",
            "lennohajo1",
            "lennohajo2",
            "lennohajo3",
            "lennohajo4",
            "MJ",
            "oblivion",
            "portofino",
            "portofinohazamenet",
            "portofinostrand",
            "portofinovonat",
            "raptor",
            "setavonat",
            "sirmione",
            "sirmionepart",
            "tuzijatek",
            "veronanaplemente"
        ];

        const arConfig = targetNames.map((name) => {
            const cleanName = name.trim();
            return {
                id: cleanName,
                video: `img/${cleanName}.mp4`,
                width: 1,
                height: 1.78
            };
        });

        document.addEventListener("DOMContentLoaded", function() {
            const assetsContainer = document.querySelector("#assets-container");
            const targetsContainer = document.querySelector("#targets-container");
            const status = document.querySelector("#status");
            const scene = document.querySelector("#ar-scene");

            scene.addEventListener("arReady", () => {
                status.textContent = "Irányítsd a kamerát valamelyik képre.";
            });

            scene.addEventListener("arError", () => {
                status.textContent = "Nem sikerült elindítani a kamerát. Ellenőrizd a böngésző engedélyeit.";
            });

            arConfig.forEach((item, index) => {
                // 1. Videó elem létrehozása
                const videoEl = document.createElement("video");
                videoEl.setAttribute("id", `video-${item.id}`);
                videoEl.setAttribute("src", item.video);
                videoEl.setAttribute("preload", "auto");
                videoEl.setAttribute("crossorigin", "anonymous");
                videoEl.setAttribute("webkit-playsinline", "");
                videoEl.setAttribute("playsinline", "");
                videoEl.muted = false;
                videoEl.loop = true;

                assetsContainer.appendChild(videoEl);

                // 2. AR Célpont létrehozása
                const targetEntity = document.createElement("a-entity");
                targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

                // 3. Videó sík létrehozása
                const videoPlane = document.createElement("a-video");
                videoPlane.setAttribute("src", `#video-${item.id}`);
                videoPlane.setAttribute("position", "0 0 0");
                videoPlane.setAttribute("width", 1);
                videoPlane.setAttribute("height", aspectRatio);
                videoPlane.setAttribute("rotation", "0 0 0");

                targetEntity.appendChild(videoPlane);
                targetsContainer.appendChild(targetEntity);

                // 4. Eseménykezelők a lejátszáshoz
                targetEntity.addEventListener("targetFound", () => {
                    console.log(`Célpont megtalálva: ${item.id}`);
                    status.textContent = `${item.id} felismerve, a videó lejátszása elindult.`;
                    videoEl.play().catch(() => {
                        status.textContent = "Érintsd meg a képernyőt a videó elindításához.";
                    });
                });

                targetEntity.addEventListener("targetLost", () => {
                    console.log(`Célpont elveszítve: ${item.id}`);
                    videoEl.pause();
                    status.textContent = "Irányítsd vissza a kamerát valamelyik képre.";
                });
            });
        });
    </script>

</body>
</html>
